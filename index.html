<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>세미콜론 ; 인증 코드</title>
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <section id="gate" class="gate">
      <form id="gate-form" class="term" autocomplete="on">
        <div class="term-bar" aria-hidden="true">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="term-title">semicolon.sh</span>
        </div>
        <div class="term-body">
          <h1 class="club">세미콜론 <span class="kw">Semicolon</span></h1>
          <p class="sub">// 코딩 동아리 전용 인증 코드 보관함</p>

          <p class="cmd" aria-hidden="true"><span class="prompt">$</span> <span class="typed" style="--n:23"><span class="fn">club</span>.<span class="fn">login</span>(<span class="var">password</span>);</span><span class="caret"></span></p>

          <label for="gate-password" class="sr-only">비밀번호</label>
          <div class="field">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <input id="gate-password" type="password" autocomplete="current-password" placeholder="password" required autofocus />
          </div>
          <p id="gate-error" class="gate-error" role="status"></p>
          <button id="gate-submit" class="run" type="submit"><span aria-hidden="true">▶</span> 실행</button>
          <p class="foot">// 동아리원만 입장 · 비밀번호는 한 번만 입력하면 돼요</p>
        </div>
      </form>
    </section>

    <div id="app" hidden>
      <header class="topbar">
        <h1>세미콜론<span class="semi">;</span></h1>
        <button id="lock-button" class="text-button" type="button">잠금</button>
      </header>

      <main>
        <div id="account-list" class="account-list" aria-live="polite"></div>
      </main>
    </div>


    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
