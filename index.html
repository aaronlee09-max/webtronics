<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Authenticator</title>
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Authenticator</h1>
    </header>

    <main>
      <div id="account-list" class="account-list" aria-live="polite"></div>
    </main>

    <button id="add-button" class="fab" type="button" aria-label="계정 추가">+</button>

    <dialog id="add-dialog">
      <form id="add-form" method="dialog">
        <h2>계정 추가</h2>
        <label for="add-uri">설정 링크 (otpauth://…) 또는 설정 키</label>
        <textarea id="add-uri" rows="3" spellcheck="false" autocomplete="off" required placeholder="otpauth://totp/서비스:계정?secret=… 또는 BJFC…"></textarea>
        <label for="add-name">이름 <span>(키만 넣을 때)</span></label>
        <input id="add-name" type="text" maxlength="80" autocomplete="off" placeholder="예: chatgpt 3" />
        <p id="add-error" class="error" role="status"></p>
        <div class="actions">
          <button id="add-cancel" type="button" class="text-button">취소</button>
          <button id="add-save" type="submit" class="text-button strong">추가</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
