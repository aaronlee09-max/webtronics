<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지식의 표현과 추론</title>
    <link rel="stylesheet" href="../textbook/styles.css" />
  </head>
  <body>
    <main class="deck" aria-live="polite">
      <section class="slide active">
        <div class="slide-header">
          <a class="home" href="../textbook/">← 교과서</a>
          <p class="unit">03</p>
          <p class="page-ref">p.42~43</p>
          <h1>지식의 표현과 추론</h1>
          <p class="subtitle">사실을 기호로 적으면 컴퓨터가 <strong>규칙</strong>으로 새 결론을 낼 수 있습니다.</p>
        </div>
        <div class="grid-3">
          <article class="card"><h2>사실</h2><p>물이 있다.<br />바깥 기온이 0도보다 낮다.</p></article>
          <article class="card green"><h2>규칙</h2><p>물이 있고 기온이 0도 이하면 얼 수 있다.</p></article>
          <article class="card orange"><h2>추론</h2><p>두 조건을 규칙에 넣으면 새로운 설명을 얻습니다.</p></article>
        </div>
        <p class="note">탐색이 길 찾기라면, 추론은 알고 있는 것으로 모르는 것을 이끄어 내는 일입니다.</p>
      </section>
      <section class="slide">
        <div class="slide-header">
          <a class="home" href="../textbook/">← 교과서</a>
          <p class="unit">확인</p>
          <p class="page-ref">p.42</p>
          <h1>확인 퀴즈</h1>
        </div>
        <div class="quiz">
          <button type="button" data-choice="ok" data-msg="맞아요. 규칙이 사실과 만나 새 결론을 만듭니다.">추론은 사실과 규칙을 연결해 새로운 결론을 내는 과정이다.</button>
          <button type="button" data-choice="no" data-msg="지식은 기호와 규칙으로 표현할 수 있습니다.">지식은 컴퓨터가 다룰 수 없게 글로만 남겨야 한다.</button>
          <p class="quiz-result"></p>
        </div>
      </section>
    </main>
