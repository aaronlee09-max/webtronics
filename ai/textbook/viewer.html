<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교과서 뷰어 · 인공지능 기초</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0f1419;color:#e8eef7;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#121826;border-bottom:1px solid #2a3348;position:sticky;top:0;z-index:10}
.bar a,.bar button{appearance:none;border:1px solid #3b465c;background:#1e2638;color:#e8eef7;border-radius:8px;padding:7px 12px;font-weight:700;text-decoration:none;cursor:pointer;font-size:13px}
.bar a.back{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
.bar a.back:hover{background:#2563eb;color:#fff}
.bar button.primary{background:#2563eb;border-color:#2563eb}
.bar button:disabled{opacity:.4;cursor:not-allowed}
.bar .title{font-weight:800;margin-right:auto;font-size:15px}
.bar .meta{color:#9aa8bd;font-size:13px;min-width:70px;text-align:center}
.bar input[type=number]{width:56px;padding:6px;border-radius:6px;border:1px solid #3b465c;background:#1e2638;color:#e8eef7;text-align:center}
.stage{height:calc(100% - 48px);overflow:auto;display:flex;justify-content:center;padding:16px;background:#0f1419}
#viewer{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:920px}
.page-canvas{background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.45);border-radius:4px;max-width:100%}
.loading{padding:80px 20px;text-align:center;color:#9aa8bd;font-size:16px}
.error{padding:40px;text-align:center;color:#f87171;max-width:480px;margin:40px auto;line-height:1.6}
@media print{.bar{display:none!important}body{background:#fff}.stage{padding:0;height:auto;overflow:visible}.page-canvas{box-shadow:none;page-break-after:always;border-radius:0}}
</style>
<style id="site-nav-float">
.site-nav-float{position:fixed;top:12px;left:12px;z-index:9999;display:flex;gap:8px;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.site-nav-float a{display:inline-block;padding:8px 14px;border-radius:999px;background:rgba(23,32,51,.88);color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.site-nav-float a:hover{background:#2563eb}
</style>
</head>
<body>
<div class="site-nav-float" id="site-nav-float"><a href="../">← 이전</a><a href="/">홈</a></div>
<div class="bar">
  <a class="back" href="./" title="교과서로 돌아가기">← 돌아가기</a>
  <a href="../" title="인공지능 기초 홈">AI 홈</a>
  <span class="title">인공지능 기초 · 교과서 PDF</span>
  <span class="meta" id="pageInfo">– / –</span>
  <button type="button" id="prevBtn" disabled>이전</button>
  <input type="number" id="pageInput" min="1" value="1" title="페이지 번호" />
  <button type="button" id="nextBtn" disabled>다음</button>
  <button type="button" id="zoomOut">−</button>
  <button type="button" id="zoomIn">+</button>
  <button type="button" class="primary" id="printBtn">인쇄</button>
</div>
<div class="stage">
  <div id="viewer">
    <div class="loading" id="status">PDF 로딩 중…</div>
  </div>
</div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) e.preventDefault();
});
const viewer = document.getElementById('viewer');
const status = document.getElementById('status');
const pageInfo = document.getElementById('pageInfo');
const pageInput = document.getElementById('pageInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let pdfDoc = null;
let currentPage = 1;
let scale = 1.35;
let rendering = false;
async function loadPdf() {
  try {
    const url = './textbook.pdf';
    const loadingTask = pdfjsLib.getDocument({ url, disableAutoFetch: false, disableStream: false });
    pdfDoc = await loadingTask.promise;
    pageInput.max = pdfDoc.numPages;
    status.remove();
    await renderPage(1);
    prevBtn.disabled = false;
    nextBtn.disabled = false;
  } catch (err) {
    console.error(err);
    status.className = 'error';
    status.innerHTML = `PDF를 불러올 수 없습니다.<br><br><b>ai/textbook/textbook.pdf</b> 확인 필요<br><br><small>${err.message || err}</small>`;
  }
}
async function renderPage(num) {
  if (!pdfDoc || rendering) return;
  rendering = true;
  currentPage = Math.max(1, Math.min(num, pdfDoc.numPages));
  pageInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
  pageInput.value = currentPage;
  viewer.querySelectorAll('canvas').forEach(c => c.remove());
  const page = await pdfDoc.getPage(currentPage);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.className = 'page-canvas';
  const ctx = canvas.getContext('2d');
  canvas.height = viewport.height;
  canvas.width = viewport.width;
  viewer.appendChild(canvas);
  await page.render({ canvasContext: ctx, viewport }).promise;
  rendering = false;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= pdfDoc.numPages;
}
prevBtn.onclick = () => renderPage(currentPage - 1);
nextBtn.onclick = () => renderPage(currentPage + 1);
pageInput.onchange = () => renderPage(parseInt(pageInput.value, 10) || 1);
document.getElementById('zoomIn').onclick = () => { scale = Math.min(2.5, scale + 0.15); renderPage(currentPage); };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.7, scale - 0.15); renderPage(currentPage); };
document.getElementById('printBtn').onclick = () => window.print();
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); renderPage(currentPage - 1); }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); renderPage(currentPage + 1); }
  if (e.key === 'Escape') { window.location.href = './'; }
});
loadPdf();
</script>
<style id="site-nav-style">
.site-nav{position:fixed;top:12px;left:12px;z-index:9999;display:flex;gap:8px;flex-wrap:wrap}
.site-nav a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
background:rgba(23,32,51,.9);color:#fff!important;font-weight:800;font-size:14px;text-decoration:none!important;
font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
box-shadow:0 4px 16px rgba(0,0,0,.28);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);
transition:background .15s ease}
.site-nav a:hover{background:#2563eb}
.site-nav a.home{background:rgba(37,99,235,.92)}
.site-nav a.home:hover{background:#1d4ed8}
@media print{.site-nav{display:none!important}}
</style>
<nav class="site-nav" aria-label="페이지 이동"><a href="./" title="이전 화면으로">← 이전</a><a class="home" href="/" title="홈으로 가기">홈</a></nav>
</body>
</html>
