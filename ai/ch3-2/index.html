<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인공지능 윤리</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../ch1-1/styles.css" />
</head>
<body>
<main class="deck" aria-live="polite">
<section class="slide active" data-slide="1">
  <div class="slide-header"><p class="unit">01</p><p class="page-ref">윤리</p><h1>인공지능 윤리</h1>
  <p class="subtitle">기술이 영향력 있을수록 <strong>책임</strong>이 따른다.</p></div>
  <div class="visual-row">
    <div class="vcard blue"><div class="emoji">⚖️</div><h3>공정</h3><p>편향 없는 대우</p></div>
    <div class="vcard green"><div class="emoji">🔒</div><h3>프라이버시</h3><p>개인정보 보호</p></div>
    <div class="vcard orange"><div class="emoji">🪞</div><h3>투명성</h3><p>설명 가능한 결정</p></div>
  </div>
</section>
<section class="slide" data-slide="2">
  <div class="slide-header"><p class="unit">02</p><p class="page-ref">위험</p><h1>주의할 점</h1>
  <p class="subtitle">편리함 뒤에 숨은 문제를 본다.</p></div>
  <div class="visual-row four">
    <div class="vcard red"><div class="emoji">📉</div><h3>편향</h3><p>데이터 편중</p></div>
    <div class="vcard orange"><div class="emoji">🕵️</div><h3>감시</h3><p>과도한 추적</p></div>
    <div class="vcard purple"><div class="emoji">🎭</div><h3>딥페이크</h3><p>허위 콘텐츠</p></div>
    <div class="vcard blue"><div class="emoji">💥</div><h3>오남용</h3><p>해로운 목적</p></div>
  </div>
</section>
<section class="slide" data-slide="3">
  <div class="slide-header"><p class="unit">03</p><p class="page-ref">활동</p><h1>우리 반 규칙</h1>
  <p class="subtitle">AI 사용에 대한 <strong>약속</strong>을 정해 보자.</p></div>
  <div class="scene"><div class="art">📋</div>
  <div class="panel"><div class="diagram"><div class="node">허용</div><div class="arrow">/</div><div class="node">금지</div><div class="arrow">/</div><div class="node hi">책임</div></div>
  <p style="margin-top:18px;font-size:22px;font-weight:800;color:#5c6b7d">예: 과제에 AI를 쓸 때 출처 밝히기</p></div></div>
</section>
</main>
