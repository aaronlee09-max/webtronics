<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인공지능 프로젝트</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../ch1-1/styles.css" />
</head>
<body>
<main class="deck" aria-live="polite">
<section class="slide active" data-slide="1">
  <div class="slide-header"><p class="unit">01</p><p class="page-ref">프로젝트</p><h1>AI 프로젝트 흐름</h1>
  <p class="subtitle">문제에서 평가까지 <strong>한 바퀴</strong></p></div>
  <div class="diagram" style="flex:1;align-content:center">
    <div class="node">문제</div><div class="arrow">→</div><div class="node">데이터</div><div class="arrow">→</div>
    <div class="node">모델</div><div class="arrow">→</div><div class="node hi">평가</div><div class="arrow">→</div><div class="node hi">개선</div>
  </div>
</section>
<section class="slide" data-slide="2">
  <div class="slide-header"><p class="unit">02</p><p class="page-ref">문제</p><h1>좋은 문제 정의</h1>
  <p class="subtitle">모호하면 모델도 흔들린다.</p></div>
  <div class="visual-row">
    <div class="vcard orange"><div class="emoji">❓</div><h3>무엇</h3><p>해결할 현상</p></div>
    <div class="vcard blue"><div class="emoji">👥</div><h3>누구</h3><p>대상 사용자</p></div>
    <div class="vcard green"><div class="emoji">📏</div><h3>성공</h3><p>측정 기준</p></div>
  </div>
</section>
<section class="slide" data-slide="3">
  <div class="slide-header"><p class="unit">03</p><p class="page-ref">데이터</p><h1>데이터 체크</h1>
  <p class="subtitle">양보다 <strong>품질과 윤리</strong></p></div>
  <div class="visual-row four">
    <div class="vcard blue"><div class="emoji">📊</div><h3>충분?</h3><p>양</p></div>
    <div class="vcard green"><div class="emoji">🧹</div><h3>깨끗?</h3><p>결측·오류</p></div>
    <div class="vcard orange"><div class="emoji">⚖️</div><h3>공정?</h3><p>편향</p></div>
    <div class="vcard purple"><div class="emoji">🔐</div><h3>허용?</h3><p>동의·출처</p></div>
  </div>
</section>
<section class="slide" data-slide="4">
  <div class="slide-header"><p class="unit">04</p><p class="page-ref">발표</p><h1>결과 공유</h1>
  <p class="subtitle">숫자만이 아니라 <strong>한계</strong>도 말한다.</p></div>
  <div class="scene"><div class="art">📢</div>
  <div class="panel"><div class="badge-list"><span>문제</span><span>데이터</span><span>모델</span><span>결과</span><span>한계</span><span>다음 계획</span></div></div></div>
</section>
</main>
<button class="nav-zone nav-prev" type="button" aria-label="이전"><span></span></button>
<button class="nav-zone nav-next" type="button" aria-label="다음"><span></span></button>
<div class="footer"><div class="dots"></div><p><span id="currentSlide">1</span> / <span id="totalSlides">1</span></p></div>
<script src="../ch1-1/script.js"></script>
</body>
</html>
