name: Sync from aaronlee09-max/informatics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync from main class repo
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git clone --depth 1 https://github.com/aaronlee09-max/informatics.git /tmp/src
          cp CNAME /tmp/CNAME.bak
          cp -r .github /tmp/github.bak
          rsync -a --delete --exclude='.git' --exclude='CNAME' --exclude='.github' /tmp/src/ ./
          cp /tmp/CNAME.bak CNAME
          rm -rf .github && cp -r /tmp/github.bak .github
          git add -A
          if git diff --staged --quiet; then echo already synced; else git commit -m "Sync from informatics" && git push; fi
