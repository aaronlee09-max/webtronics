name: Sync from bloomgloom/informatics

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN || github.token }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and sync
        env:
          TOKEN: ${{ secrets.PERSONAL_TOKEN || github.token }}
        run: |
          git clone --depth 1 https://github.com/bloomgloom/informatics.git /tmp/upstream

          cp CNAME /tmp/CNAME.bak 2>/dev/null || true
          cp -r .github /tmp/github.bak 2>/dev/null || true

          rsync -a --delete \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='.github' \
            /tmp/upstream/ ./

          if [ -f /tmp/CNAME.bak ]; then
            cp /tmp/CNAME.bak CNAME
          else
            echo "aaronlee.run.place" > CNAME
          fi

          if [ -d /tmp/github.bak ]; then
            rm -rf .github
            cp -r /tmp/github.bak .github
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "Already up to date with upstream"
          else
            git commit -m "Sync from bloomgloom/informatics $(date -u +%Y-%m-%d)"
            git push origin main
          fi
