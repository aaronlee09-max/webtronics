name: Sync to mirror repos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: aitronics
            cname: informatics.run.place
          - repo: Softronics
            cname: aaronshlee.run.place
          - repo: datatronics
            cname: datatronics-softronics.run.place
          - repo: webtronics
            cname: webtronics.run.place
    steps:
      - name: Checkout informatics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to ${{ matrix.repo }}
        env:
          TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          TARGET: ${{ matrix.repo }}
          CNAME_VALUE: ${{ matrix.cname }}
        run: |
          git clone --depth 1 https://x-access-token:${TOKEN}@github.com/aaronlee09-max/${TARGET}.git /tmp/${TARGET}
          cp /tmp/${TARGET}/CNAME /tmp/${TARGET}-CNAME.bak 2>/dev/null || true
          rsync -a --delete --exclude='.git' --exclude='CNAME' ./ /tmp/${TARGET}/
          if [ -f /tmp/${TARGET}-CNAME.bak ]; then
            cp /tmp/${TARGET}-CNAME.bak /tmp/${TARGET}/CNAME
          elif [ -n "$CNAME_VALUE" ]; then
            echo "$CNAME_VALUE" > /tmp/${TARGET}/CNAME
          else
            rm -f /tmp/${TARGET}/CNAME
          fi
          cd /tmp/${TARGET}
          git add -A
          if git diff --staged --quiet; then
            echo "${TARGET} already up to date"
          else
            git commit -m "Sync from informatics $(date -u +%Y-%m-%d)"
            git push origin main
          fi
