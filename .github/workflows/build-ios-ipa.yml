name: Build Webtronics iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out native iOS project
        uses: actions/checkout@v4
        with:
          ref: feature/native-ios-app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate valid Xcode project
        run: xcodegen generate --spec WebtronicsIOS/project.yml --project WebtronicsIOS

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WebtronicsIOS/Webtronics.xcodeproj \
            -scheme Webtronics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/WebtronicsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app as unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/WebtronicsDerivedData/Build/Products/Release-iphoneos/Webtronics.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Webtronics.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/Webtronics-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/Webtronics-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Webtronics-unsigned-IPA
          path: Webtronics-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
